# Config for THIS repo's own tooling (tooling/myapp/, tooling/scripts/, tooling/tools/, tooling/tests/).
#
# There is deliberately no [project] table and no build backend. myapp IS a package now —
# it has to be, or lint-imports cannot build a dependency graph and the architecture
# contract is unenforceable — but it is not a distributable one: no version constraints, no
# entry points, nothing to publish. It lives in tooling/myapp/ and is imported as `myapp`, which
# is why pytest's pythonpath below starts with "tooling" (and pre-commit's lint-imports sets it).
#
# The copy-me version, with the baseline and ratchet blocks a real codebase needs, is
# course/templates/python/pyproject.toml.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tooling", "tooling/scripts", "tooling/tools", "tooling/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "TID", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["tooling/myapp", "tooling/scripts", "tooling/tools", "tooling/tests"]
# myapp lives in tooling/ and is imported as `myapp`; the scripts import each other by bare name.
mypy_path = ["tooling", "tooling/tools", "tooling/scripts"]

[tool.pytest.ini_options]
testpaths = ["tooling/tests"]
addopts = "-q"
# "tooling" makes myapp importable; tooling/tools/ and tooling/scripts/ hold scripts
# rather than packages. Putting them on the path here beats sys.path surgery in test files.
pythonpath = ["tooling", "tooling/tools", "tooling/scripts"]
