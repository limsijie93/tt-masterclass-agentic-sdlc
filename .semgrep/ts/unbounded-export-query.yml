rules:
  - id: unbounded-export-query-ts
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      buildExportQuery() called without an explicit chunkSize. The default is unbounded,
      which loads the whole result set into memory and is what makes an export time out on a
      large account. Pass chunkSize explicitly.
    metadata:
      category: correctness
      origin: PROJ-142 review, finding 1
      # The TypeScript twin of .semgrep/unbounded-export-query.yml. Same defect, same
      # message, same provenance — a human caught this once, so it became a rule.
      #
      # WHY TWO FILES AND NOT ONE MULTI-LANGUAGE RULE. Semgrep spans 30+ languages, so a
      # single rule declaring `languages: [python, typescript, javascript]` looks like the
      # obvious move. It silently breaks the negation: with both languages declared, the
      # Python `pattern-not: build_export_query(..., chunk_size=$N, ...)` stops excluding
      # Python keyword-argument calls, and every correct call gets flagged.
      #
      # Measured, not assumed: same patterns, `languages: [python]` flags lines 12 and 17 of
      # the Python fixture (correct); `languages: [python, typescript, javascript]` flags 12,
      # 17, 22 and 27 — where 22 and 27 are the `# ok:` cases.
      #
      # The reason is that a pattern matches real syntax. Python keyword arguments and
      # TypeScript object literals are different grammar, and a negation written for one
      # cannot hold for the other. What ports is the DECISION; the pattern never does.
      rule-family: unbounded-export-query
    # BOTH CALL FORMS. The Python twin matched only unqualified calls and therefore matched
    # none of the real callers in tooling/myapp/, while passing its own tests — see
    # ../unbounded-export-query.yml. This rule had the identical blind spot and is corrected
    # by analogy.
    #
    # HONEST LIMIT: there is no TypeScript application in this repository, so this fix is
    # verified only against the fixture below. The Python one was verified against real
    # calling code, which is how the defect was found at all. Treat this as the weaker of the
    # two until a TS caller exists.
    patterns:
      - pattern-either:
          - pattern: buildExportQuery(...)
          - pattern: $MODULE.buildExportQuery(...)
      # Quoted: `chunkSize: $N` inside would otherwise parse as a YAML mapping.
      - pattern-not: "buildExportQuery(..., {..., chunkSize: $N, ...})"
      - pattern-not: "$MODULE.buildExportQuery(..., {..., chunkSize: $N, ...})"
