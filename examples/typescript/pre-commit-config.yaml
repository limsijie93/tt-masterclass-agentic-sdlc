# WORKED EXAMPLE — TypeScript / JavaScript. Copy to `.pre-commit-config.yaml` at your repo root.
#
# Read this beside examples/python/pre-commit-config.yaml. The structure is identical: the
# same six tier-1 hooks in the same order, the same stages, the same pass_filenames choices,
# the same two language-agnostic repos at the bottom. Only the tool names and the `language:`
# runtime differ.
#
# That similarity is the point. pre-commit is the layer that ports.

default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies: ["prettier@3.3.3"]
        types_or: [ts, tsx, javascript, jsx, json, css, markdown]
        stages: [pre-commit]

      - id: eslint
        name: eslint --fix
        entry: eslint --fix --max-warnings 0
        language: node
        # THE RATCHET: --report-unused-disable-directives makes an eslint-disable that is no
        # longer needed a FAILURE, so fixing the code forces deleting the suppression. This
        # is the direct analogue of ruff's RUF100 and mypy's warn_unused_ignores.
        args: ["--report-unused-disable-directives"]
        additional_dependencies:
          - "eslint@9.9.0"
          - "typescript-eslint@8.2.0"
        types_or: [ts, tsx, javascript, jsx]
        stages: [pre-commit]

      # NOT diff-scoped, and this differs from the Python column in a way worth knowing.
      # `tsc` type-checks a PROJECT, not a file list, so "only the changed files" is not
      # really available. pass_filenames: false is honest about that; the compensation is a
      # stricter baseline in tsconfig.
      - id: tsc
        name: tsc --noEmit
        entry: tsc --noEmit -p tsconfig.json
        language: node
        additional_dependencies: ["typescript@5.5.4"]
        pass_filenames: false
        stages: [pre-commit]

      # Whole-graph, exactly like lint-imports in the Python column.
      - id: dependency-cruiser
        name: dependency-cruiser (architecture contract)
        entry: depcruise --config .dependency-cruiser.cjs src
        language: node
        additional_dependencies: ["dependency-cruiser@16.3.10"]
        pass_filenames: false
        stages: [pre-commit]

      # Same tool as the Python column, different rule file. One rule per language —
      # see .semgrep/README.md for the measurement that forced that.
      - id: semgrep
        name: custom org rules
        entry: semgrep scan --config .semgrep/ --error --quiet
        language: python
        additional_dependencies: ["semgrep==1.86.0"]
        types_or: [ts, tsx, javascript, jsx]
        stages: [pre-commit]

      - id: vitest
        name: vitest
        entry: vitest run
        language: node
        additional_dependencies: ["vitest@2.0.5"]
        pass_filenames: false
        stages: [pre-push]

  # Identical to the Python column. Nothing here knows what language you write.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
