# WORKED EXAMPLE — Python. Rename to `.importlinter` at your repository root.
#
# The stack-neutral version of this decision is
# .github/skills/gates-draft/references/gates-by-stack.md, which maps each standard to its
# executable form per ecosystem. The TypeScript equivalent of this file is
# examples/typescript/dependency-cruiser.config.cjs — same contract, different parser.
#
# You should not write this by hand. `.github/skills/gates-draft` emits it from the prose
# rule in your AGENTS.md plus whatever stack `stack-profile` detected.
#
# It is NOT named that here on purpose. `lint-imports` builds its dependency graph by
# importing the root package, and this repo has no `myapp` package — so a root-level
# `.importlinter` would fail on every single commit, and a companion repo with a
# permanently red build undercuts the point of the exercise.
#
# NOTE ON THE SLIDE: slide 22 shows the [importlinter:contract:layers] block below,
# verbatim. What the slide omits is the [importlinter] section above it — without
# `root_package`, `lint-imports` errors out rather than running. Worth saying on the
# slide, because a viewer who types in exactly what they see gets an error.
#
# SYNTAX: this is the INI dialect, which is what the slide shows. The TOML equivalent,
# for teams who keep everything in pyproject.toml, is at the bottom of this file.

[importlinter]
root_package = myapp

# --- The contract from the slide -------------------------------------------------------
#
# One direction only: this forbids a LOWER layer importing a HIGHER one, so myapp.repo can
# never reach up into myapp.service or myapp.api.
#
# WHAT IT DOES NOT DO, AND THE SLIDE IMPLIES OTHERWISE. It does not forbid a higher layer
# SKIPPING a layer. `myapp.api -> myapp.repo` is KEPT by the contract below — verified by
# adding that import to the real application in this repository and watching lint-imports
# pass. So "the obvious way to make an export fast is to stream rows straight out of the
# data layer from the view, and this is what stops it" was wrong about which stanza stops
# it. The layers contract does not; the `forbidden` contract further down does.
#
# import-linter has no closed-layer option in the pinned version, which is why the shortcut
# needs its own contract rather than an option on this one.

[importlinter:contract:layers]
name = Layered architecture
type = layers
layers =
    myapp.api
    myapp.service
    myapp.repo

# --- The contract that actually blocks the shortcut ------------------------------------
#
# `allow_indirect_imports` is not optional. `forbidden` reports INDIRECT chains by default,
# so without it this fires on `api -> service -> repo` — the correct path through the
# layers. A gate that fails on healthy code gets deleted by the first person in a hurry.

[importlinter:contract:api-never-calls-repo]
name = The API layer goes through the service layer
type = forbidden
source_modules =
    myapp.api
forbidden_modules =
    myapp.repo
allow_indirect_imports = true

# --- A third contract, in the same file ------------------------------------------------
#
# `myapp.tasks` is not one of the three layers, so the layers contract says nothing about
# it. Background jobs may call the service layer; they must never reach back up into the
# HTTP layer. `forbidden` is the right tool for a rule that is not about ordering.
#
# This also fills the "public API surface" row of segment 06's prose-to-executable table,
# and it demonstrates that one file holds several contracts.

[importlinter:contract:tasks-never-call-api]
name = Background tasks do not call the API layer
type = forbidden
source_modules =
    myapp.tasks
forbidden_modules =
    myapp.api

# --- The baseline, and the thing that makes it a ratchet --------------------------------
#
# Do not switch a contract on across an established repo and triage the fallout. Record
# today's violations here, block only new ones, and shrink this list over time. Every line
# carries a ticket, so it is debt with a name rather than a permanent exemption.
#
# `unmatched_ignore_imports_alerting = error` is what makes it a ratchet instead of an
# amnesty: once the underlying import is actually gone, the ignore line no longer matches
# anything and the build fails until someone deletes it. The suppression expires by
# itself.
#
# VERIFY THIS OPTION NAME against the import-linter version you pin. It landed in the
# 1.7/2.x era and is the single most likely thing in this file to be wrong on an older
# release.

unmatched_ignore_imports_alerting = error

# Example of what a baselined violation looks like, inside the contract it applies to:
#
#   [importlinter:contract:layers]
#   ...
#   ignore_imports =
#       myapp.api.reports.legacy -> myapp.repo.exports    # TODO(ARCH-118)
#       myapp.api.accounts.views -> myapp.repo.accounts   # TODO(ARCH-119)

# --- TOML equivalent -------------------------------------------------------------------
#
# [tool.importlinter]
# root_package = "myapp"
#
# [[tool.importlinter.contracts]]
# name = "Layered architecture"
# type = "layers"
# layers = ["myapp.api", "myapp.service", "myapp.repo"]
#
# [[tool.importlinter.contracts]]
# name = "Background tasks do not call the API layer"
# type = "forbidden"
# source_modules = ["myapp.tasks"]
# forbidden_modules = ["myapp.api"]
