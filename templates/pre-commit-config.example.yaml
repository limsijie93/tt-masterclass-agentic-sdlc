# Copy to `.pre-commit-config.yaml` at your repository root.
#
# STACK-NEUTRAL SHAPE. pre-commit is not a Python tool despite where it came from — it
# manages hooks written in Python, Node, Go, Rust, Ruby and Docker. This layer is the reason
# tier 1 ports even though none of the tools inside it do.
#
# Filled versions: examples/python/pre-commit-config.yaml
#                  examples/typescript/pre-commit-config.yaml
#
# `.github/skills/gates-draft` writes this for whatever stack `stack-profile` found. Read
# templates/README.md before turning any of it on across an existing repo.
#
# ---------------------------------------------------------------------------------------
# WHAT "THE SAME COMMANDS AS AGENTS.md" MEANS
#
# The claim is that the constraint the agent obeys and the gate the pull request passes are
# the same rule. Argv identity is NOT achievable, and pretending otherwise ships a broken
# file:
#
#   - A whole-repo lint scans everything. pre-commit's entire value is scanning STAGED
#     files. Same rule, deliberately different scope.
#   - An architecture contract is a whole-graph check. It cannot be diff-scoped at all.
#   - Tests do not belong at commit time. A 40-second commit gets bypassed within a week,
#     and a bypassed gate is worse than no gate because you think you have one.
#
# So the identity lives one level down: every rule is configured in exactly ONE place, and
# nothing here changes WHAT is enforced — only which files are looked at.
# tools/check_commands_sync.py fails the build if the tool set here and the Commands
# section of your AGENTS.md diverge.
# ---------------------------------------------------------------------------------------

# Without this, a pre-push hook is never installed by a bare `pre-commit install`, and
# "tests are gated" is false on every machine.
default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: local
    hooks:
      # Order matters: format first, so the linter sees formatted code and does not report
      # churn the formatter is about to fix anyway.
      - id: format
        name: <formatter>
        entry: <formatter command>
        language: <python | node | golang | rust | system>
        additional_dependencies: ["<tool>==<pinned version>"]
        types_or: [<file types>]
        stages: [pre-commit]

      - id: lint
        name: <linter>
        entry: <linter command>
        language: <...>
        additional_dependencies: ["<tool>==<pinned version>"]
        types_or: [<file types>]
        stages: [pre-commit]

      # Diff-scoped by construction: pre-commit passes the staged files. Where your type
      # checker cannot work on a file subset (tsc, for instance, checks a project), lean
      # harder on the baseline instead and say so here.
      - id: types
        name: <type checker>
        entry: <type check command>
        language: <...>
        stages: [pre-commit]

      # Whole-graph by nature, so `pass_filenames: false` is correct rather than lazy.
      # Its baseline lives in the contract file, not here.
      - id: architecture
        name: <architecture contract>
        entry: <contract command>
        language: <...>
        pass_filenames: false
        stages: [pre-commit]

      # The rules only your team could write. One rule per language — see .semgrep/README.md
      # for why a single multi-language rule silently breaks negations.
      - id: custom-rules
        name: custom org rules
        entry: semgrep scan --config .semgrep/ --error --quiet
        language: python
        additional_dependencies: ["semgrep==<pinned>"]
        stages: [pre-commit]

      # NOT at pre-commit. See the header. Needs default_install_hook_types above.
      - id: tests
        name: <test runner>
        entry: <test command>
        language: <...>
        pass_filenames: false
        stages: [pre-push]

  # Language-agnostic hooks. These are identical in every ecosystem, which is the clearest
  # demonstration that this layer is not language-bound.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

# VERIFY BEFORE YOU SHIP: every `rev` and every pinned version above. Dependabot does not
# understand pre-commit revs or additional_dependencies — that needs `pre-commit autoupdate`
# run by hand, or pre-commit.ci. Stale pins in a repo built to be copied are a slow rot
# vector, so the gap is written down rather than assumed.
